server {
    listen 80;
    server_name chuanweifire.com www.chuanweifire.com;
    return 301 https://chuanweifire.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.chuanweifire.com;
    ssl_certificate /etc/letsencrypt/live/chuanweifire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chuanweifire.com/privkey.pem;
    return 301 https://chuanweifire.com$request_uri;
}

server {
    listen 443 ssl;
    server_name chuanweifire.com;
    ssl_certificate /etc/letsencrypt/live/chuanweifire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chuanweifire.com/privkey.pem;

    root /var/www/chuanwei-fire;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
